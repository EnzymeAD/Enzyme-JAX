include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

# Maintainer runbook — overlay design, every workaround, and the UENV bump
# checklist: ci/cscs-mi300.md. Comments below are one-line pointers into it.
test-gb-25:
  extends: .baremetal-runner-beverin-mi300
  variables:
    JULIA: /users/lraess/julia_amd/julia_amd-1.11
    UENV: 56ebb909a6164680
    JULIA_PKG_SERVER_REGISTRY_PREFERENCE: conservative
    JULIA_MAX_NUM_PRECOMPILE_FILES: 3
    # Pinned configuration — expand into a matrix once the single case passes
    REACTANT_COMMIT: main
    GB25_COMMIT: main
    FLOAT_TYPE: '--float-type=Float64'
    # Slurm resource request
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS_PER_NODE: 1
    SLURM_GPUS_PER_TASK: 4
    SLURM_TIMELIMIT: "02:30:00"
    # Paths — all under CI_PROJECT_DIR (scratch) to avoid touching user home/cache
    REACTANT_DIR: "${CI_PROJECT_DIR}/Reactant.jl"
    GB25_DIR: "${CI_PROJECT_DIR}/GB-25"
    LOCAL_BIN: "${CI_PROJECT_DIR}/bin"
    JULIA_DEPOT_PATH: "${CI_PROJECT_DIR}/.julia"    # overrides default ~/.julia
    BAZELISK_HOME: "${CI_PROJECT_DIR}/.bazelisk"   # overrides default ~/.cache/bazelisk
    BAZEL_OUTPUT_ROOT: "${CI_PROJECT_DIR}/.bazel"  # used by the bazel wrapper
    # ROCm path — UENV-specific, update when the UENV hash changes.
    # ROCM_PATH is overridden in the script to point at the overlay (view + MIOpen).
    ROCM_PATH: "/user-environment/env/default"
    # Clique init measured at ~57 s here, so the 10 s default floods the log with
    # "may be stuck" warnings it then retracts. See cscs-mi300.md: "Collective timeouts".
    XLA_FLAGS: "--xla_gpu_first_collective_call_warn_stuck_timeout_seconds=120 --xla_gpu_first_collective_call_terminate_timeout_seconds=600"

  script:
    # Create all job-scoped directories up front
    - mkdir -p "${LOCAL_BIN}" "${JULIA_DEPOT_PATH}" "${BAZELISK_HOME}" "${BAZEL_OUTPUT_ROOT}"

    # Shorthands for the repeated compute-step invocations. Plain shell vars: all
    # script steps share one shell (as the PATH export below already relies on).
    - SRUN_UENV="srun -n 1 --export=ALL --uenv ${UENV} --view=default"
    - JULIA_FLAGS="--color=yes -O0 --startup-file=no --threads=16 --compiled-modules=strict"

    # bazelisk/bazel wrappers pinning --output_user_root. See cscs-mi300.md: "Bazel output root".
    - |
      curl -fsSL -o "${LOCAL_BIN}/bazelisk-real" \
        https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
      chmod +x "${LOCAL_BIN}/bazelisk-real"
      for CMD in bazelisk bazel; do
        cat > "${LOCAL_BIN}/${CMD}" << 'WRAPPER'
      #!/bin/bash
      set -euo pipefail
      if [[ -z "${BAZEL_OUTPUT_ROOT:-}" ]]; then
        echo "ERROR: BAZEL_OUTPUT_ROOT is not set. Refusing to run (would write to ~/.cache/bazel)." >&2
        exit 1
      fi
      if [[ "${BAZEL_OUTPUT_ROOT}" != "${CI_PROJECT_DIR}"* ]]; then
        echo "ERROR: BAZEL_OUTPUT_ROOT (${BAZEL_OUTPUT_ROOT}) is not under CI_PROJECT_DIR (${CI_PROJECT_DIR})." >&2
        exit 1
      fi
      exec "$(dirname "$0")/bazelisk-real" --output_user_root="${BAZEL_OUTPUT_ROOT}" "$@"
      WRAPPER
        chmod +x "${LOCAL_BIN}/${CMD}"
      done
    - export PATH="${LOCAL_BIN}:${PATH}"
    # Verify the wrappers are resolved first — catch misconfigured PATH early
    - |
      for CMD in bazelisk bazel; do
        RESOLVED=$(command -v "${CMD}")
        if [[ "${RESOLVED}" != "${LOCAL_BIN}/${CMD}" ]]; then
          echo "ERROR: ${CMD} resolves to ${RESOLVED}, expected ${LOCAL_BIN}/${CMD}" >&2
          exit 1
        fi
        echo "OK: ${CMD} -> ${RESOLVED}"
      done

    # Clone Reactant.jl and patch in the current Enzyme-JAX commit
    - git clone --depth=1 --branch "${REACTANT_COMMIT}" https://github.com/EnzymeAD/Reactant.jl "${REACTANT_DIR}"
    - sed -i 's/ENZYMEXLA_COMMIT = ".*"/ENZYMEXLA_COMMIT = "'"${CI_COMMIT_SHA}"'"/' "${REACTANT_DIR}/deps/ReactantExtra/WORKSPACE"
    - grep ENZYMEXLA_COMMIT "${REACTANT_DIR}/deps/ReactantExtra/WORKSPACE"

    # Instantiate the Reactant build environment (no GPU/UENV needed here)
    - cd "${REACTANT_DIR}/deps" && ${JULIA} --project --color=yes -e 'using Pkg; Pkg.instantiate()'

    # Generate build_reactant.sh — assembles the ROCm overlay, then runs Bazel. Runs
    # later inside srun, where the UENV is mounted. See cscs-mi300.md: "Overview" for
    # the overlay design and "Heredoc levels" for the \$ escaping rules below.
    - |
      cat > "${CI_PROJECT_DIR}/build_reactant.sh" << BUILDSCRIPT
      #!/bin/bash
      set -euo pipefail
      # Seed include/ from the view, minus toolchain headers. See md: "LLVM headers".
      mkdir -p "${CI_PROJECT_DIR}/.rocm/include"
      for f in /user-environment/env/default/include/*; do
        [[ -e "\$f" ]] || continue
        name="\$(basename "\$f")"
        case "\${name}" in
          llvm|llvm-c|mlir|mlir-c|clang|clang-c|lld|lldb|polly) continue ;;
        esac
        ln -sfn "\$f" "${CI_PROJECT_DIR}/.rocm/include/\${name}"
      done
      # MIOpen and rocm-smi-lib are separate spack packages, not in the view.
      # See md: "rocm-smi header".
      for pkg in /user-environment/linux-zen3/miopen-hip-*/; do
        [[ -f "\${pkg}include/miopen/version.h" ]] || continue
        ln -sfn "\${pkg}include/miopen" "${CI_PROJECT_DIR}/.rocm/include/miopen"
        export CPATH="\${pkg}include\${CPATH:+:\${CPATH}}"
        break
      done
      if [[ ! -e "${CI_PROJECT_DIR}/.rocm/include/rocm_smi/rocm_smi.h" ]]; then
        for pkg in /user-environment/linux-zen3/rocm-smi-lib-*/ \
                   /user-environment/linux-zen3/rocm-smi-*/ \
                   /user-environment/linux-zen3/*/; do
          [[ -f "\${pkg}include/rocm_smi/rocm_smi.h" ]] || continue
          ln -sfn "\${pkg}include/rocm_smi" "${CI_PROJECT_DIR}/.rocm/include/rocm_smi"
          export CPATH="\${pkg}include\${CPATH:+:\${CPATH}}"
          echo "rocm_smi -> \${pkg}include/rocm_smi"
          break
        done
      fi
      # amdgcn and bin are deliberately NOT whole-dir symlinks.
      # See md: "amdgcn must stay a real dir", "clang wrapper + HIP_CLANG_PATH".
      for d in lib64 share; do
        [[ -e "/user-environment/env/default/\${d}" ]] && \
          ln -sfn "/user-environment/env/default/\${d}" "${CI_PROJECT_DIR}/.rocm/\${d}"
      done
      mkdir -p "${CI_PROJECT_DIR}/.rocm/bin"
      for f in /user-environment/env/default/bin/*; do
        [[ -e "\$f" ]] || continue
        name="\$(basename "\$f")"
        [[ -e "${CI_PROJECT_DIR}/.rocm/bin/\${name}" ]] || \
          ln -sfn "\$f" "${CI_PROJECT_DIR}/.rocm/bin/\${name}"
      done
      # Device bitcode is needed at two paths. See md: "Device bitcode (two locations)".
      DEVICE_LIB_DIR=""
      if [[ -f "${CI_PROJECT_DIR}/.rocm/amdgcn/bitcode/ocml.bc" ]]; then
        DEVICE_LIB_DIR="\$(dirname "\$(readlink -f "${CI_PROJECT_DIR}/.rocm/amdgcn/bitcode/ocml.bc")")"
      else
        for candidate in \
          /user-environment/env/default/amdgcn/bitcode \
          /user-environment/env/default/lib/llvm/lib/clang/*/amdgcn/bitcode \
          /user-environment/env/default/lib/clang/*/amdgcn/bitcode \
          /user-environment/linux-zen3/rocm-device-libs-*/amdgcn/bitcode \
          /user-environment/linux-zen3/rocm-device-libs-*/lib/amdgcn/bitcode \
          /user-environment/linux-zen3/llvm-amdgpu-*/lib/clang/*/amdgcn/bitcode; do
          [[ -f "\${candidate}/ocml.bc" ]] || continue
          DEVICE_LIB_DIR="\${candidate}"
          break
        done
      fi
      if [[ -n "\${DEVICE_LIB_DIR}" ]]; then
        for parent in "${CI_PROJECT_DIR}/.rocm/amdgcn" "${CI_PROJECT_DIR}/.rocm/lib/llvm/amdgcn"; do
          [[ -L "\${parent}" ]] && rm -f "\${parent}"
          mkdir -p "\${parent}"
        done
        rm -f "${CI_PROJECT_DIR}/.rocm/amdgcn/bitcode" "${CI_PROJECT_DIR}/.rocm/lib/llvm/amdgcn/bitcode"
        ln -s "\${DEVICE_LIB_DIR}" "${CI_PROJECT_DIR}/.rocm/amdgcn/bitcode"
        ln -s "\${DEVICE_LIB_DIR}" "${CI_PROJECT_DIR}/.rocm/lib/llvm/amdgcn/bitcode"
        echo "amdgcn/bitcode -> \${DEVICE_LIB_DIR}"
        echo "lib/llvm/amdgcn/bitcode -> \${DEVICE_LIB_DIR}"
      else
        echo "WARNING: ROCm device libraries not found; HIP compilation may fail"
      fi
      # lib/ is per-file symlinks, view first then spack. See md: "Overlay lib/ layout".
      mkdir -p "${CI_PROJECT_DIR}/.rocm/lib"
      for subdir in lib lib64; do
        for f in /user-environment/env/default/\${subdir}/*.so*; do
          [[ -e "\$f" ]] || continue
          name="\$(basename "\$f")"
          [[ -e "${CI_PROJECT_DIR}/.rocm/lib/\${name}" ]] || \
            ln -sfn "\$f" "${CI_PROJECT_DIR}/.rocm/lib/\${name}"
        done
      done
      for pkg in /user-environment/linux-zen3/*/; do
        for subdir in lib lib64; do
          [[ -d "\${pkg}\${subdir}" ]] || continue
          for item in "\${pkg}\${subdir}/"*.so*; do
            [[ -e "\${item}" ]] || continue
            name="\$(basename "\${item}")"
            [[ -e "${CI_PROJECT_DIR}/.rocm/lib/\${name}" ]] || \
              ln -sfn "\${item}" "${CI_PROJECT_DIR}/.rocm/lib/\${name}"
          done
        done
      done
      # Overlay-local clang resource dir. See md: "clang wrapper + HIP_CLANG_PATH".
      REAL_CLANG_BIN="\$(which clang 2>/dev/null || true)"
      if [[ -z "\${REAL_CLANG_BIN}" || ! -x "\${REAL_CLANG_BIN}" ]]; then
        echo "ERROR: clang not found in PATH; llvm/bin/clang wrapper not created" >&2
        exit 1
      fi
      REAL_CLANGXX_BIN="\$(dirname "\${REAL_CLANG_BIN}")/clang++"
      [[ -x "\${REAL_CLANGXX_BIN}" ]] || REAL_CLANGXX_BIN="\${REAL_CLANG_BIN}"
      REAL_RESOURCE_DIR="\$("\${REAL_CLANG_BIN}" -print-resource-dir)"
      CLANG_RESOURCE_VERSION="\$(basename "\${REAL_RESOURCE_DIR}")"
      OVERLAY_RESOURCE_DIR="${CI_PROJECT_DIR}/.rocm/llvm/lib/clang/\${CLANG_RESOURCE_VERSION}"
      mkdir -p "${CI_PROJECT_DIR}/.rocm/llvm/bin" "\$(dirname "\${OVERLAY_RESOURCE_DIR}")"
      rm -rf "\${OVERLAY_RESOURCE_DIR}"
      cp -a "\${REAL_RESOURCE_DIR}" "\${OVERLAY_RESOURCE_DIR}"
      # XLA's crosstool patch realpath's a hardcoded lib/llvm/lib/clang/22/include and
      # dies if it is absent; alias it here. See md: "hipcc resource dir".
      mkdir -p "${CI_PROJECT_DIR}/.rocm/lib/llvm/lib/clang"
      for v in "\${CLANG_RESOURCE_VERSION}" 22; do
        ln -sfn "\${OVERLAY_RESOURCE_DIR}" "${CI_PROJECT_DIR}/.rocm/lib/llvm/lib/clang/\${v}"
      done
      # One wrapper per driver, also linked into bin/ (HIP calls bin/clang++ directly,
      # bypassing PATH). The wrapper forces -resource-dir and maps gold -> lld.
      for drv in clang clang++; do
        if [[ "\${drv}" == "clang" ]]; then real="\${REAL_CLANG_BIN}"; else real="\${REAL_CLANGXX_BIN}"; fi
        cat > "${CI_PROJECT_DIR}/.rocm/llvm/bin/\${drv}" << WRAPPER
      #!/bin/bash
      if [[ "\\\$#" -eq 1 && "\\\$1" == "-print-resource-dir" ]]; then
        printf '%s\n' "\${OVERLAY_RESOURCE_DIR}"
        exit 0
      fi
      args=()
      for arg in "\\\$@"; do
        if [[ "\\\${arg}" == "-fuse-ld=gold" ]]; then
          args+=("-fuse-ld=lld")
        else
          args+=("\\\${arg}")
        fi
      done
      exec "\${real}" -resource-dir "\${OVERLAY_RESOURCE_DIR}" "\\\${args[@]}"
      WRAPPER
        chmod +x "${CI_PROJECT_DIR}/.rocm/llvm/bin/\${drv}"
        ln -sfn "${CI_PROJECT_DIR}/.rocm/llvm/bin/\${drv}" "${CI_PROJECT_DIR}/.rocm/bin/\${drv}"
      done
      CLANG_BIN="${CI_PROJECT_DIR}/.rocm/llvm/bin/clang"
      CLANGXX_BIN="${CI_PROJECT_DIR}/.rocm/llvm/bin/clang++"
      export PATH="${CI_PROJECT_DIR}/.rocm/llvm/bin:\${PATH}"
      export HIP_CLANG_PATH="${CI_PROJECT_DIR}/.rocm/llvm/bin"
      # Overlay check (compact, always-on) — headers, device bitcode, hipcc resource
      # dir, then the fatal shadow guard. See md: "Diagnostics".
      echo "=== ROCm overlay check ==="
      for f in rocm-core/rocm_version.h hip/hip_version.h miopen/version.h \
               rocblas/internal/rocblas-version.h rocrand/rocrand_version.h \
               rocfft/rocfft-version.h hipfft/hipfft-version.h \
               roctracer/roctracer.h hipsparse/hipsparse-version.h \
               hipsolver/internal/hipsolver-version.h rocsolver/rocsolver-version.h \
               rocm_smi/rocm_smi.h; do
        [[ -e "${CI_PROJECT_DIR}/.rocm/include/\${f}" ]] && echo "  ok   \${f}" || echo "  MISS \${f}"
      done
      for b in amdgcn/bitcode/ocml.bc lib/llvm/amdgcn/bitcode/ocml.bc \
               lib/llvm/lib/clang/22/include/stddef.h; do
        [[ -e "${CI_PROJECT_DIR}/.rocm/\${b}" ]] && echo "  ok   \${b}" || echo "  MISS \${b}"
      done
      for d in llvm mlir clang; do
        [[ -e "${CI_PROJECT_DIR}/.rocm/include/\${d}" ]] && \
          { echo "FATAL: overlay include/\${d} shadows XLA's LLVM/MLIR" >&2; exit 1; }
      done
      # Curate reactant_libs/ for run_julia.sh. readlink -f: JULIA may be a symlink,
      # and the dirname chain must walk the real prefix. See md: "Curated runtime libs".
      JULIA_LIBDIR="\$(dirname "\$(dirname "\$(readlink -f "${JULIA}")")")/lib/julia"
      CURATED="${CI_PROJECT_DIR}/.rocm/reactant_libs"
      rm -rf "\${CURATED}"; mkdir -p "\${CURATED}"
      shopt -s nullglob
      for f in "${CI_PROJECT_DIR}/.rocm/lib/"*.so*; do
        [[ -e "\$f" ]] || continue
        base="\$(basename "\$f")"
        stem="\${base%%.so*}"
        jmatch=("\${JULIA_LIBDIR}/\${stem}".so*)
        (( \${#jmatch[@]} )) && continue
        ln -sfn "\$f" "\${CURATED}/\${base}"
      done
      shopt -u nullglob
      echo "  curated \$(ls -1 "\${CURATED}" 2>/dev/null | wc -l) runtime libs"
      echo "========================="
      # PATH already leads with the wrapper dir (exported above).
      # See md: "Bazel extraopts" for why each flag is here.
      cd "${REACTANT_DIR}/deps" && ${JULIA} --project --color=yes -O0 build_local.jl \
        --cc=clang --gcc_host_compiler_path= \
        --extraopt="--repo_env=ROCM_PATH=${CI_PROJECT_DIR}/.rocm" \
        --extraopt="--repo_env=TF_ROCM_AMDGPU_TARGETS=gfx942" \
        --extraopt="--action_env=PATH=\${PATH}" \
        --extraopt="--action_env=HIP_CLANG_PATH=${CI_PROJECT_DIR}/.rocm/llvm/bin" \
        --extraopt="--action_env=CLANGXX_COMPILER_PATH=\${CLANGXX_BIN}" \
        --extraopt="--linkopt=-fuse-ld=lld" \
        --extraopt="--host_linkopt=-fuse-ld=lld" \
        --extraopt="--action_env=CLANG_COMPILER_PATH=\${CLANG_BIN}"
      BUILDSCRIPT
      chmod +x "${CI_PROJECT_DIR}/build_reactant.sh"

    # Build libReactant — the script creates the ROCm overlay then invokes Bazel
    - ${SRUN_UENV} "${CI_PROJECT_DIR}/build_reactant.sh"

    # Generate run_julia.sh — Julia + LD_LIBRARY_PATH=curated ROCm libs, used by every
    # Reactant-loading step inside srun. See cscs-mi300.md: "run_julia.sh".
    - |
      cat > "${CI_PROJECT_DIR}/run_julia.sh" << 'RUNSCRIPT'
      #!/bin/bash
      set -euo pipefail
      # Curated dir ONLY. See cscs-mi300.md: "Curated runtime libs".
      export LD_LIBRARY_PATH="${CI_PROJECT_DIR}/.rocm/reactant_libs"
      exec "${JULIA}" "$@"
      RUNSCRIPT
      chmod +x "${CI_PROJECT_DIR}/run_julia.sh"

    # Clone GB-25 and set up its Julia environment
    - git clone --depth=1 --branch "${GB25_COMMIT}" https://github.com/PRONTOLab/GB-25 "${GB25_DIR}"
    - cp "${REACTANT_DIR}/LocalPreferences.toml" "${GB25_DIR}/LocalPreferences.toml"
    # Inside srun so libReactantExtra.so's ROCm deps resolve while Pkg precompiles
    - |
      ${SRUN_UENV} "${CI_PROJECT_DIR}/run_julia.sh" --project="${GB25_DIR}" --color=yes -e "
        using Pkg
        Pkg.add([
            PackageSpec(; name=\"ReactantCore\", rev=\"${REACTANT_COMMIT}\"),
            PackageSpec(; name=\"Reactant\",     rev=\"${REACTANT_COMMIT}\"),
        ])
        Pkg.instantiate()
        Pkg.gc()"

    # Compile the GB-25 simulation. cd first: compile.jl writes its .xla artifacts
    # relative to the *current* directory, which is otherwise still Reactant.jl/deps
    # from the instantiate step. See cscs-mi300.md: "Collectives gate".
    - cd "${GB25_DIR}"
    - ${SRUN_UENV} timeout 29m "${CI_PROJECT_DIR}/run_julia.sh" --project="${GB25_DIR}" ${JULIA_FLAGS} "${GB25_DIR}/sharding/sharded_baroclinic_instability_simulation_compile.jl" ${FLOAT_TYPE}

    # Check remaining collective operations against thresholds (copied from A100 case; calibrate for MI300)
    - |
      cd "${GB25_DIR}"
      # Guard: with no .xla files every threshold below compares against 0 and the
      # gate passes without checking anything. See cscs-mi300.md: "Collectives gate".
      NUM_XLA=$(find . -name 'optimised_sharded_baroclinic_instability*.xla' | wc -l)
      if [[ "${NUM_XLA}" -eq 0 ]]; then
          echo "ERROR: compile step produced no optimised_sharded_baroclinic_instability*.xla under $(pwd);" >&2
          echo "       the collective thresholds below would pass vacuously." >&2
          exit 1
      fi
      echo "Checking ${NUM_XLA} .xla file(s) against collective thresholds"
      OK="true"
      ALL_TO_ALL_THRESHOLD=1000
      ALL_GATHER_THRESHOLD=1000
      ALL_REDUCE_THRESHOLD=1000
      COLLECTIVE_PERMUTE_THRESHOLD=29900  # TODO: calibrate for MI300

      for OP in "all-to-all" "all-gather" "all-reduce" "%collective-permute-start.* ="; do
          COLLECTIVES=$(find . -name 'optimised_sharded_baroclinic_instability*.xla' \
              -exec grep --with-filename --line-number --extended-regexp "${OP}" '{}' \; | sort)
          NUM_COLLECTIVES=$(echo "${COLLECTIVES}" | grep -c . || true)
          if [[ -n "${COLLECTIVES}" ]]; then
              echo "Found ${NUM_COLLECTIVES} remaining '${OP}' operations"
              echo "${COLLECTIVES}"
              if [[ "${OP}" == "all-to-all" && ${NUM_COLLECTIVES} -gt ${ALL_TO_ALL_THRESHOLD}           ]] || \
                 [[ "${OP}" == "all-gather" && ${NUM_COLLECTIVES} -gt ${ALL_GATHER_THRESHOLD}           ]] || \
                 [[ "${OP}" == "all-reduce" && ${NUM_COLLECTIVES} -gt ${ALL_REDUCE_THRESHOLD}           ]] || \
                 [[ "${OP}" =~ "collective-permute" && ${NUM_COLLECTIVES} -gt ${COLLECTIVE_PERMUTE_THRESHOLD} ]]; then
                  OK="false"
              fi
          fi
      done
      [[ "${OK}" == "true" ]] || exit 1

    # Run the GB-25 simulation
    - ${SRUN_UENV} timeout 59m "${CI_PROJECT_DIR}/run_julia.sh" --project="${GB25_DIR}" ${JULIA_FLAGS} "${GB25_DIR}/sharding/sharded_baroclinic_instability_simulation_run.jl" ${FLOAT_TYPE}

    # Test correctness
    - ${SRUN_UENV} timeout 19m "${CI_PROJECT_DIR}/run_julia.sh" --project="${GB25_DIR}" ${JULIA_FLAGS} "${GB25_DIR}/correctness/correctness_sharded_baroclinic_instability_simulation_run.jl" ${FLOAT_TYPE}

  # The runner wipes the job directory on cleanup, so a crash otherwise leaves
  # nothing to inspect. Keep the compiled program text. (MLIR dumps under
  # GB-25/sharding/mlir_dumps/ are far larger and deliberately not collected.)
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - GB-25/optimised_sharded_baroclinic_instability*.xla
