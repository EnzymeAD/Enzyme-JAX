name: "Open PR to update JAX commit"

on:
  schedule:
    - cron: '19 22 * * *'
  workflow_dispatch:
    inputs:
      jax_commit:
        description: 'The JAX commit to update to (optional)'
        default: ''
        type: 'string'

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  pr-latest-jax:
    name: "Update JAX"
    uses: ./.github/workflows/update-dependency.yml
    with:
      upstream_repo: "jax-ml/jax"
      upstream_commit: ${{ inputs.jax_commit }}
      variable_name: "JAX_COMMIT"
      # A google3-exported PR may have pinned XLA explicitly; a new JAX commit
      # brings its own XLA pin, so drop the override.
      clear_variable_name: "XLA_COMMIT_OVERRIDE"
    secrets: inherit
