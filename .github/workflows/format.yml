name: Clang-Format

on:
  push:
    branches:
      - main
    paths: &paths
      - '.github/workflows/format.yml'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'src/**/*.cc'
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - '!src/external/**'
  pull_request:
    branches:
      - main
    paths: *paths
  merge_group:

jobs:
  build:
    name: Format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - name: Install git-clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format
    - name: Check formatting on diff
      run: |
        clang-format --style=file --dump-config >/dev/null
        git clang-format --style=file --extensions=cc,cpp,h --diff HEAD^1 HEAD -- src
