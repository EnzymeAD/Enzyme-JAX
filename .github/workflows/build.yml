name: Build Enzyme-JAX

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build - ${{ matrix.os }} - python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/enzymead/reactant-docker-images@sha256:cd45d851f5ea544f88d042eafefa53d948c229fffcab6189019324e3b02b505a
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux-x86-n4-32
        python:
          - "3.11"
    env:
      HERMETIC_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - name: Set BAZEL_FLAGS
        shell: bash
        run: |
          set -e
          BAZEL_FLAGS="--test_env=TPU_SKIP_MDS_QUERY=true --test_env=JAX_PLATFORMS=cpu"
          BAZEL_FLAGS="${BAZEL_FLAGS} --repo_env=CC=`which clang`"
          BAZEL_FLAGS="${BAZEL_FLAGS} --config=public_cache"
          BAZEL_FLAGS="${BAZEL_FLAGS} --sandbox_base=/dev/shm"
          echo "BAZEL_FLAGS=${BAZEL_FLAGS}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          bazelisk-version: 1.x
      - name: Update JAX version
        run: |
          sed -i.bak0 "s/jax\[cuda12\]/jax[cpu]/g" builddeps/requirements.in
          sed -i.bak0 "/pypi_jax_cuda12_plugin/d" test/BUILD
        shell: bash
      - name: Update Python requirements files
        run: |
          bazel run $BAZEL_FLAGS --color=yes //builddeps:requirements.update
      - name: Build enzymexlamlir-opt
        timeout-minutes: 180
        run: |
          bazel build $BAZEL_FLAGS --color=yes //:enzymexlamlir-opt --test_output=errors
      - name: Runner identity
        shell: bash
        run: |
          set -x
          uname -a; cat /proc/version; cat /proc/cpuinfo | head -12; nproc; free -g
          dmesg 2>&1 | head -30 || true
          cat /proc/self/mountinfo | head -20 || true
          ls -la /proc/sys/fs /sys/kernel 2>&1 | head -20 || true
          cat /proc/self/status | grep -E "Seccomp|NoNewPrivs|CapEff" || true
          env | grep -i -E "runner|gvisor|docker|container|image" | sort || true
          cat /etc/os-release | head -4 || true
          getconf CLK_TCK; ulimit -a | head -5
          python3 - <<'PY'
          import os, time
          t=time.time(); n=0
          while time.time()-t < 1: os.getpid(); n+=1
          print(f"getpid/s: {n}")
          t=time.time(); n=0
          while time.time()-t < 1: os.stat('/proc/self'); n+=1
          print(f"stat/s: {n}")
          t=time.time()
          for i in range(200): os.spawnlp(os.P_WAIT, '/bin/true', 'true')
          print(f"fork+exec /bin/true: {(time.time()-t)/200*1000:.2f} ms each")
          PY
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lit-timing-diag
          path: |
            /tmp/prof_*.json
            /tmp/out_*.txt
            /tmp/build_*.txt
            /tmp/spawn*.sh
            /tmp/spawn_*.txt
            /tmp/strace_spawn.txt
            /tmp/out_spawn.txt
          retention-days: 7
