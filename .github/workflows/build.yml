name: Build Enzyme-JAX

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build - ${{ matrix.os }} - python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/enzymead/reactant-docker-images@sha256:cd45d851f5ea544f88d042eafefa53d948c229fffcab6189019324e3b02b505a
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux-x86-n4-32
        python:
          - "3.11"
    env:
      HERMETIC_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - name: Set BAZEL_FLAGS
        shell: bash
        run: |
          set -e
          BAZEL_FLAGS="--test_env=TPU_SKIP_MDS_QUERY=true --test_env=JAX_PLATFORMS=cpu"
          BAZEL_FLAGS="${BAZEL_FLAGS} --repo_env=CC=`which clang`"
          BAZEL_FLAGS="${BAZEL_FLAGS} --config=public_cache"
          BAZEL_FLAGS="${BAZEL_FLAGS} --sandbox_base=/dev/shm"
          echo "BAZEL_FLAGS=${BAZEL_FLAGS}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          bazelisk-version: 1.x
      - name: Update JAX version
        run: |
          sed -i.bak0 "s/jax\[cuda12\]/jax[cpu]/g" builddeps/requirements.in
          sed -i.bak0 "/pypi_jax_cuda12_plugin/d" test/BUILD
        shell: bash
      - name: Update Python requirements files
        run: |
          bazel run $BAZEL_FLAGS --color=yes //builddeps:requirements.update
      - name: Build enzymexlamlir-opt
        timeout-minutes: 180
        run: |
          bazel build $BAZEL_FLAGS --color=yes //:enzymexlamlir-opt --test_output=errors
      - name: Lit timing diagnostics
        shell: bash
        run: |
          set -x
          set +o pipefail
          echo "== machine"; nproc; free -g; df -h /dev/shm /root/.bazel "$(bazel info output_base)" || true; mount | grep -E "shm|/root" | head -5 || true
          bazel query 'tests(//test/lit_tests/...)' > /tmp/all_tests.txt 2>/dev/null
          TESTS=$(head -64 /tmp/all_tests.txt)
          # Build everything the variant's configuration needs first, so that
          # the timed run only executes the tests. BZ carries startup options.
          run() { name=$1; shift; echo "== $name"; bazel $BZ build $BAZEL_FLAGS "$@" $TESTS > /dev/null 2>&1 || true; ( time bazel $BZ test $BAZEL_FLAGS --nocache_test_results --test_output=errors --profile=/tmp/prof_$name.json "$@" $TESTS ) 2>&1 | grep -E "Executed|Elapsed|real|TIMEOUT|FAILED" || true; }
          BZ=""
          run base
          run inprocess --experimental_inprocess_symlink_creation
          run trimmed --extra_toolchains=//builddeps:trimmed_py_toolchain
          run trimmed_inprocess --extra_toolchains=//builddeps:trimmed_py_toolchain --experimental_inprocess_symlink_creation
          run base_again
          echo "== runfiles file counts (base / trimmed)"
          bazel build $BAZEL_FLAGS //test/lit_tests:cse_iota.mlir.test > /dev/null 2>&1; find -L bazel-bin/test/lit_tests/cse_iota.mlir.test.runfiles -type f | wc -l
          bazel build $BAZEL_FLAGS --extra_toolchains=//builddeps:trimmed_py_toolchain //test/lit_tests:cse_iota.mlir.test > /dev/null 2>&1; find -L bazel-bin/test/lit_tests/cse_iota.mlir.test.runfiles -type f | wc -l
          # Output base on tmpfs: a fresh output base, so the build is repeated
          # (remote cache hits); the time of that build is reported too.
          echo "== build with output base on /dev/shm"
          RC=$(bazel info repository_cache)
          BZ="--output_user_root=/dev/shm/bazel"
          ( time bazel $BZ build $BAZEL_FLAGS --repository_cache=$RC --color=yes //:enzymexlamlir-opt ) 2>&1 | grep -E "Elapsed|real|ERROR" || true
          df -h /dev/shm || true; du -sh /dev/shm/bazel 2>/dev/null || true
          run shmroot --repository_cache=$RC
          run shmroot_trimmed --repository_cache=$RC --extra_toolchains=//builddeps:trimmed_py_toolchain
          run shmroot_trimmed_inprocess --repository_cache=$RC --extra_toolchains=//builddeps:trimmed_py_toolchain --experimental_inprocess_symlink_creation
          bazel $BZ shutdown || true
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lit-timing-diag
          path: |
            /tmp/prof_*.json
          retention-days: 7
