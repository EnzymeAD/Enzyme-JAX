name: Build Enzyme-JAX

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build - ${{ matrix.os }} - python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/enzymead/reactant-docker-images@sha256:cd45d851f5ea544f88d042eafefa53d948c229fffcab6189019324e3b02b505a
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux-x86-n4-32
        python:
          - "3.11"
    env:
      HERMETIC_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - name: Set BAZEL_FLAGS
        shell: bash
        run: |
          set -e
          BAZEL_FLAGS="--test_env=TPU_SKIP_MDS_QUERY=true --test_env=JAX_PLATFORMS=cpu"
          BAZEL_FLAGS="${BAZEL_FLAGS} --repo_env=CC=`which clang`"
          BAZEL_FLAGS="${BAZEL_FLAGS} --config=public_cache"
          BAZEL_FLAGS="${BAZEL_FLAGS} --sandbox_base=/dev/shm"
          echo "BAZEL_FLAGS=${BAZEL_FLAGS}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          bazelisk-version: 1.x
      - name: Update JAX version
        run: |
          sed -i.bak0 "s/jax\[cuda12\]/jax[cpu]/g" builddeps/requirements.in
          sed -i.bak0 "/pypi_jax_cuda12_plugin/d" test/BUILD
        shell: bash
      - name: Update Python requirements files
        run: |
          bazel run $BAZEL_FLAGS --color=yes //builddeps:requirements.update
      - name: Build enzymexlamlir-opt
        timeout-minutes: 180
        run: |
          bazel build $BAZEL_FLAGS --color=yes //:enzymexlamlir-opt --test_output=errors
      - name: Lit timing diagnostics
        shell: bash
        run: |
          set -x
          set +o pipefail
          echo "== machine"; nproc; free -g; df -h /dev/shm /root/.bazel "$(bazel info output_base)" || true; mount | grep -E "shm|/root" | head -5 || true
          bazel query 'tests(//test/lit_tests/...)' > /tmp/all_tests.txt 2>/dev/null
          TESTS=$(head -64 /tmp/all_tests.txt)
          # Build everything the variant's configuration needs first, so that
          # the timed run only executes the tests. BZ carries startup options.
          # A per-variant --test_env keeps every timed run in a configuration
          # of its own, so bazel never treats the tests as already run.
          # Each variant runs twice (noise between repeats was ~4 s). The
          # sandbox stash bazel keeps for reuse is dropped between variants:
          # carried across configurations it failed with "Could not copy
          # inputs into sandbox ... (File exists)".
          run() { name=$1; shift; for i in 1 2; do v=${name}_$i; echo "== $v"; bazel $BZ shutdown > /dev/null 2>&1 || true; rm -rf /dev/shm/bazel-sandbox.* || true; bazel $BZ build $BAZEL_FLAGS --test_env=DIAG_VARIANT=$v "$@" $TESTS > /tmp/build_$v.txt 2>&1 || true; ( time bazel $BZ test $BAZEL_FLAGS --test_env=DIAG_VARIANT=$v --nocache_test_results --test_output=errors --profile=/tmp/prof_$v.json "$@" $TESTS ) > /tmp/out_$v.txt 2>&1 || true; grep -E "Executed|Elapsed|real|TIMEOUT|FAILED|skipped|ERROR" /tmp/out_$v.txt || true; done; }
          BZ=""
          DIR=--extra_toolchains=//builddeps:dir_py_toolchain
          apt-get update -qq > /dev/null 2>&1 && apt-get install -y -qq strace > /dev/null 2>&1 || true
          echo "== the exact test spawn (local strategy, -s)"
          bazel shutdown > /dev/null 2>&1 || true
          bazel test $BAZEL_FLAGS $DIR -s --strategy=TestRunner=local --test_env=DIAG_VARIANT=spawn --nocache_test_results //test/lit_tests:cse_iota.mlir.test > /tmp/out_spawn.txt 2>&1 || true
          grep -E "Executed|FAILED" /tmp/out_spawn.txt || true
          python3 - <<'PY' || true
          import re
          s = re.sub(r'\x1b\[[0-9;]*m', '', open('/tmp/out_spawn.txt', errors='replace').read())
          m = re.search(r"SUBCOMMAND: [^\n]*Testing //test/lit_tests:cse_iota\.mlir\.test'[^\n]*\n(\(cd .*?\n[^\n]*\))\n", s, re.S)
          cmd = m.group(1) + "\n" if m else "echo 'no spawn found'\n"
          open('/tmp/spawn.sh', 'w').write(cmd)
          last = re.search(r"\n(  external/bazel_tools/tools/test/test-setup\.sh [^\n]*\))\n$", cmd).group(1)
          # The bare test binary with the same environment (runfiles paths made absolute, as test-setup.sh does), no test-setup.sh.
          direct = cmd.replace(last, "  bash -c 'export RUNFILES_DIR=$PWD/$RUNFILES_DIR TEST_SRCDIR=$PWD/$TEST_SRCDIR PYTHON_RUNFILES=$PWD/$PYTHON_RUNFILES JAVA_RUNFILES=$PWD/$JAVA_RUNFILES; cd $TEST_SRCDIR/$TEST_WORKSPACE && exec $OLDPWD/bazel-out/k8-opt/bin/test/lit_tests/cse_iota.mlir.test -v test/lit_tests/cse_iota.mlir')")
          open('/tmp/spawn_direct.sh', 'w').write(direct)
          # test-setup.sh around /bin/true: the wrapper's own cost.
          wrapper = cmd.replace(last, "  external/bazel_tools/tools/test/test-setup.sh /bin/true)")
          open('/tmp/spawn_wrapper.sh', 'w').write(wrapper)
          # test-setup.sh with TEST_TMPDIR and every testlogs output on tmpfs.
          shm = cmd.replace("bazel-out/k8-opt/testlogs/", "/dev/shm/testlogs/").replace("TEST_TMPDIR=_tmp/", "TEST_TMPDIR=/dev/shm/tmp/")
          open('/tmp/spawn_shm.sh', 'w').write(shm)
          print(direct[-330:]); print(wrapper[-120:])
          PY
          mkdir -p /dev/shm/testlogs/test/lit_tests/cse_iota.mlir.test /dev/shm/tmp
          echo "-- one direct run, checked:"; bash /tmp/spawn_direct.sh 2>&1 | tail -3
          echo "-- one wrapper-only run, checked:"; bash /tmp/spawn_wrapper.sh 2>&1 | tail -2
          par() { name=$1; shift; for r in 1 2 3; do ( time ( for i in $(seq 32); do bash "$@" > /dev/null 2>&1 & done; wait ) ) 2>&1 | grep real | sed "s/^/$name x32: /"; done; ( time bash "$@" > /dev/null 2>&1 ) 2>&1 | grep real | sed "s/^/$name x1: /"; }
          par spawn /tmp/spawn.sh
          par direct /tmp/spawn_direct.sh
          par wrapper /tmp/spawn_wrapper.sh
          par shm /tmp/spawn_shm.sh
          echo 'true' > /tmp/bashtrue.sh; par bashtrue /tmp/bashtrue.sh
          echo "== files opened for writing / created by one spawn (strace)"
          strace -f -ttt -e trace=%file -o /tmp/strace_spawn.txt bash /tmp/spawn.sh > /dev/null 2>&1 || true
          python3 - <<'PY' || true
          import re, collections
          w = collections.Counter(); r = collections.Counter(); n = 0
          for line in open('/tmp/strace_spawn.txt', errors='replace'):
              n += 1
              m = re.search(r'(openat|open|creat|mkdir|mkdirat|rename|renameat|unlink|unlinkat|symlink|chmod)\((?:AT_FDCWD, )?"([^"]*)"(.*)', line)
              if not m: continue
              call, path, rest = m.groups()
              key = re.sub(r'(execroot/__main__/[^/]+/[^/]+/[^/]+).*', r'\1', path)
              key = re.sub(r'(/root/\.bazel/external/[^/]+).*', r'\1', key)
              key = re.sub(r'(/__w/[^/]+/[^/]+/[^/]+).*', r'\1', key)
              key = re.sub(r'(/dev/shm/[^/]+).*', r'\1', key)
              key = re.sub(r'(/usr/[^/]+/[^/]+).*', r'\1', key)
              if call in ('openat', 'open') and not re.search(r'O_WRONLY|O_RDWR|O_CREAT', rest):
                  r[key] += 1
              else:
                  w[call + ' ' + key] += 1
          print(f"{n} traced lines")
          print("--- writes/creates:"); [print(f"{c:5d} {k}") for k, c in w.most_common(25)]
          print("--- reads (opens), top:"); [print(f"{c:5d} {k}") for k, c in r.most_common(12)]
          PY
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lit-timing-diag
          path: |
            /tmp/prof_*.json
            /tmp/out_*.txt
            /tmp/build_*.txt
            /tmp/spawn*.sh
            /tmp/spawn_*.txt
            /tmp/strace_spawn.txt
            /tmp/out_spawn.txt
          retention-days: 7
