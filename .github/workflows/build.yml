name: Build Enzyme-JAX

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build - ${{ matrix.os }} - python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/enzymead/reactant-docker-images@sha256:cd45d851f5ea544f88d042eafefa53d948c229fffcab6189019324e3b02b505a
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux-x86-n4-32
        python:
          - "3.11"
    env:
      HERMETIC_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - name: Set BAZEL_FLAGS
        shell: bash
        run: |
          set -e
          BAZEL_FLAGS="--test_env=TPU_SKIP_MDS_QUERY=true --test_env=JAX_PLATFORMS=cpu"
          BAZEL_FLAGS="${BAZEL_FLAGS} --repo_env=CC=`which clang`"
          BAZEL_FLAGS="${BAZEL_FLAGS} --config=public_cache"
          echo "BAZEL_FLAGS=${BAZEL_FLAGS}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          bazelisk-version: 1.x
      - name: Update JAX version
        run: |
          sed -i.bak0 "s/jax\[cuda12\]/jax[cpu]/g" builddeps/requirements.in
          sed -i.bak0 "/pypi_jax_cuda12_plugin/d" test/BUILD
        shell: bash
      - name: Update Python requirements files
        run: |
          bazel run $BAZEL_FLAGS --color=yes //builddeps:requirements.update
      - name: Build enzymexlamlir-opt
        timeout-minutes: 180
        run: |
          bazel build $BAZEL_FLAGS --color=yes //:enzymexlamlir-opt --test_output=errors
      - name: Lit timing diagnostics
        shell: bash
        run: |
          set -x
          apt-get update -qq > /dev/null 2>&1 && apt-get install -y -qq strace procps > /dev/null 2>&1 || true
          echo "== machine"; nproc; free -g; uptime; grep -m1 "model name" /proc/cpuinfo; df -h /root/.bazel /tmp "$PWD" || true
          mount | grep -E " / | /root| /tmp| /__w" | head -10 || true
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
          bazel version
          T=//test/lit_tests:cse_iota.mlir.test
          echo "== bazel test, default (sandboxed), profiled"
          time bazel test $BAZEL_FLAGS --nocache_test_results --test_output=all --test_summary=detailed --profile=/tmp/prof_sandbox.json $T || true
          echo "== bazel test, local strategy"
          time bazel test $BAZEL_FLAGS --nocache_test_results --test_output=all --test_summary=detailed --strategy=TestRunner=local --spawn_strategy=local --profile=/tmp/prof_local.json $T || true
          echo "== bazel test, python import timing (top entries)"
          bazel test $BAZEL_FLAGS --nocache_test_results --test_output=all --test_env=PYTHONPROFILEIMPORTTIME=1 $T 2>&1 | grep -E "import time:" | sort -t'|' -k2 -n | tail -15 || true
          echo "== direct run of the test binary"
          ( cd bazel-bin/test/lit_tests && time ./cse_iota.mlir.test -v ) || true
          echo "== direct run under strace"
          ( cd bazel-bin/test/lit_tests && strace -f -tt -e trace=execve,connect,wait4,clone,clone3,exit_group -o /tmp/strace.txt ./cse_iota.mlir.test -v ) || true
          wc -l /tmp/strace.txt || true; head -3 /tmp/strace.txt || true; tail -3 /tmp/strace.txt || true
          echo "== 16 parallel direct runs"
          ( cd bazel-bin/test/lit_tests && time ( for i in $(seq 16); do ./cse_iota.mlir.test -v > /dev/null 2>&1 & done; wait ) ) || true
          echo "== 32 lit tests through bazel, sandboxed"
          time bazel test $BAZEL_FLAGS --nocache_test_results --test_output=errors --test_summary=detailed --profile=/tmp/prof_32.json $(bazel query 'tests(//test/lit_tests/...)' 2>/dev/null | head -32) || true
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lit-timing-diag
          path: |
            /tmp/prof_sandbox.json
            /tmp/prof_local.json
            /tmp/prof_32.json
            /tmp/strace.txt
            bazel-out/**/test.log
          retention-days: 7
