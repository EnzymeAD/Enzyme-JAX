name: Build Enzyme-JAX

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build - ${{ matrix.os }} - python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/enzymead/reactant-docker-images@sha256:cd45d851f5ea544f88d042eafefa53d948c229fffcab6189019324e3b02b505a
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux-x86-n4-32
        python:
          - "3.11"
    env:
      HERMETIC_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - name: Set BAZEL_FLAGS
        shell: bash
        run: |
          set -e
          BAZEL_FLAGS="--test_env=TPU_SKIP_MDS_QUERY=true --test_env=JAX_PLATFORMS=cpu"
          BAZEL_FLAGS="${BAZEL_FLAGS} --repo_env=CC=`which clang`"
          BAZEL_FLAGS="${BAZEL_FLAGS} --config=public_cache"
          echo "BAZEL_FLAGS=${BAZEL_FLAGS}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          bazelisk-version: 1.x
      - name: Update JAX version
        run: |
          sed -i.bak0 "s/jax\[cuda12\]/jax[cpu]/g" builddeps/requirements.in
          sed -i.bak0 "/pypi_jax_cuda12_plugin/d" test/BUILD
        shell: bash
      - name: Update Python requirements files
        run: |
          bazel run $BAZEL_FLAGS --color=yes //builddeps:requirements.update
      - name: Build enzymexlamlir-opt
        timeout-minutes: 180
        run: |
          bazel build $BAZEL_FLAGS --color=yes //:enzymexlamlir-opt --test_output=errors
      - name: Lit timing diagnostics
        shell: bash
        run: |
          set -x
          echo "== machine"; nproc; df -h /dev/shm /root/.bazel || true; mount | grep -E "shm|/root" | head -5 || true
          TESTS=$(bazel query 'tests(//test/lit_tests/...)' 2>/dev/null | head -64)
          run() { name=$1; shift; echo "== $name"; ( time bazel test $BAZEL_FLAGS --nocache_test_results --test_output=errors --profile=/tmp/prof_$name.json "$@" $TESTS ) 2>&1 | grep -E "Executed|Elapsed|real|TIMEOUT|FAILED" || true; }
          run default
          run shm --sandbox_base=/dev/shm
          run nolegacy --nolegacy_external_runfiles
          run shm_nolegacy --sandbox_base=/dev/shm --nolegacy_external_runfiles
          run local --strategy=TestRunner=local
          run local_nolegacy --strategy=TestRunner=local --nolegacy_external_runfiles
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lit-timing-diag
          path: |
            /tmp/prof_*.json
          retention-days: 7
