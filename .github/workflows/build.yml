name: Build Enzyme-JAX

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build - ${{ matrix.os }} - python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/enzymead/reactant-docker-images@sha256:cd45d851f5ea544f88d042eafefa53d948c229fffcab6189019324e3b02b505a
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux-x86-n4-32
        python:
          - "3.11"
    env:
      HERMETIC_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - name: Set BAZEL_FLAGS
        shell: bash
        run: |
          set -e
          BAZEL_FLAGS="--test_env=TPU_SKIP_MDS_QUERY=true --test_env=JAX_PLATFORMS=cpu"
          BAZEL_FLAGS="${BAZEL_FLAGS} --repo_env=CC=`which clang`"
          BAZEL_FLAGS="${BAZEL_FLAGS} --config=public_cache"
          BAZEL_FLAGS="${BAZEL_FLAGS} --sandbox_base=/dev/shm"
          echo "BAZEL_FLAGS=${BAZEL_FLAGS}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          bazelisk-version: 1.x
      - name: Update JAX version
        run: |
          sed -i.bak0 "s/jax\[cuda12\]/jax[cpu]/g" builddeps/requirements.in
          sed -i.bak0 "/pypi_jax_cuda12_plugin/d" test/BUILD
        shell: bash
      - name: Update Python requirements files
        run: |
          bazel run $BAZEL_FLAGS --color=yes //builddeps:requirements.update
      - name: Build enzymexlamlir-opt
        timeout-minutes: 180
        run: |
          bazel build $BAZEL_FLAGS --color=yes //:enzymexlamlir-opt --test_output=errors
      - name: Compile phase with the output base on tmpfs, sandboxed and not
        shell: bash
        run: |
          set -x
          RC=$(bazel info repository_cache)
          BZ="--output_user_root=/dev/shm/bazel"
          ( time bazel $BZ build $BAZEL_FLAGS --repository_cache=$RC --remote_cache= --noremote_accept_cached --copt=-DDIAG_CPUS=0 @llvm-project//mlir:IR @llvm-project//llvm:Analysis ) 2>&1 | grep -E "real|ERROR" | sed "s/^/warmup (tmpfs output base, fetch + build): /" || true
          du -sh /dev/shm/bazel 2>/dev/null; df -h /dev/shm | tail -1
          for v in sandbox local sandbox local; do bazel $BZ shutdown > /dev/null 2>&1 || true; extra=""; [ $v = local ] && extra="--spawn_strategy=local"; ( time bazel $BZ build $BAZEL_FLAGS --repository_cache=$RC --remote_cache= --noremote_accept_cached --copt=-DDIAG_V=$v$RANDOM $extra @llvm-project//mlir:IR @llvm-project//llvm:Analysis ) 2>&1 | grep -E "real|processes:|ERROR" | sed "s/^/tmpfs-outbase $v: /"; done
          du -sh /dev/shm/bazel 2>/dev/null; df -h /dev/shm | tail -1
          bazel $BZ shutdown || true
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lit-timing-diag
          path: |
            /tmp/prof_*.json
            /tmp/out_*.txt
            /tmp/build_*.txt
            /tmp/spawn*.sh
            /tmp/spawn_*.txt
            /tmp/strace_spawn.txt
            /tmp/out_spawn.txt
          retention-days: 7
