name: Test GB-25

on:
  workflow_call:
    inputs:
      os:
        description: 'Runner label'
        required: true
        type: string
      libreactant_artifact:
        description: 'Prebuilt libReactant workflow artifact name'
        required: true
        type: string
      julia_version:
        description: 'Julia version'
        required: false
        default: '1.11'
        type: string
      xla_commit:
        description: 'XLA commit label for artifact naming'
        required: false
        default: ''
        type: string
      gb25_commit:
        description: 'GB-25 commit or branch'
        required: false
        default: 'main'
        type: string
      reactant_commit:
        description: 'Reactant.jl commit or branch'
        required: false
        default: 'main'
        type: string

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: 'eager'
  JULIA_MAX_NUM_PRECOMPILE_FILES: 3

jobs:
  test-gb-25:
    name: 'Test GB-25 - ${{ inputs.os }} - julia ${{ inputs.julia_version }} - XLA ${{ inputs.xla_commit }} - GB-25 ${{ inputs.gb25_commit }}- Reactant ${{ inputs.reactant_commit }} - ${{ matrix.grid }}'
    runs-on: ${{ inputs.os }}
    timeout-minutes: 150

    container:
      image: ${{ (contains(inputs.os, 'linux') && 'ghcr.io/enzymead/reactant-docker-images@sha256:cd45d851f5ea544f88d042eafefa53d948c229fffcab6189019324e3b02b505a' ) || '' }}

    strategy:
      fail-fast: false
      matrix:
        grid:
          - '--float-type=Float64'
          - '--float-type=Float32'

    steps:
      - name: Check GPUs
        if: ${{ contains(inputs.os, 'a100') }}
        run: |
          nvidia-smi
      - name: Set Artifacts index
        shell: bash
        run: |
          ARTIFACT_INDEX="${{ inputs.os }}-${{ inputs.julia_version }}-${{ inputs.xla_commit }}-${{ inputs.gb25_commit }}-${{ inputs.reactant_commit }}-${{ matrix.grid }}"
          ARTIFACT_INDEX=${ARTIFACT_INDEX//\//_}
          ARTIFACT_INDEX=${ARTIFACT_INDEX// /}
          echo "ARTIFACT_INDEX=${ARTIFACT_INDEX}" >> "${GITHUB_ENV}"
      - name: Checkout Enzyme-JAX helper scripts
        uses: actions/checkout@v7
        with:
          path: 'enzyme-jax-scripts'
          sparse-checkout: '.github/scripts'
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia_version }}
      - name: Load Julia packages from cache
        uses: julia-actions/cache@v3.5.0
        with:
          gcp-bucket: ${{ (contains(inputs.os, 'linux') && 'enzyme-ci-transient' ) || '' }}
          key-prefix: enzymejax-gb25-v2/
      - name: Checkout GB-25
        uses: actions/checkout@v7
        with:
          repository: 'PRONTOLab/GB-25'
          ref: ${{ inputs.gb25_commit }}
          path: 'GB-25'
      - name: Set GB25_DIR
        # We have to use `${GITHUB_WORKSPACE}` instead of `github.workspace` because GitHub
        # is terrible and the two don't match inside containers:
        # https://github.com/actions/runner/issues/2058
        run: |
          GB25_DIR=${GITHUB_WORKSPACE}/GB-25
          ls -lhrt "${GB25_DIR}"
          echo "GB25_DIR=${GB25_DIR}" >> ${GITHUB_ENV}
      - name: Download prebuilt libReactant
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.libreactant_artifact }}
          path: ${{ runner.temp }}/libreactant-artifact
      - name: Install prebuilt libReactant
        shell: bash
        run: |
          "${GITHUB_WORKSPACE}/enzyme-jax-scripts/.github/scripts/install_libreactant.sh" \
            "${RUNNER_TEMP}/libreactant-artifact/libreactant.tar.zst" \
            "${GITHUB_WORKSPACE}/libreactant" \
            "${GB25_DIR}/LocalPreferences.toml"
      - name: Instantiate GB-25 environment
        timeout-minutes: 40
        shell: julia --project --color=yes {0}
        run: |
          using Pkg
          if !isempty("${{ inputs.reactant_commit }}")
              Pkg.add([
                  PackageSpec(; name="ReactantCore", rev="${{ inputs.reactant_commit }}"),
                  PackageSpec(; name="Reactant", rev="${{ inputs.reactant_commit }}"),
              ])
          end
          Pkg.instantiate()
          Pkg.gc()
        working-directory: ${{ env.GB25_DIR }}
      - name: Upload Julia project environment
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        if: ${{ always() }}
        with:
          name: 'julia-environment-${{ env.ARTIFACT_INDEX }}'
          path: |
            ${{ env.GB25_DIR }}/Manifest.toml
            ${{ env.GB25_DIR }}/Project.toml
          retention-days: 90
          overwrite: false
      - name: Install mpiexecjl
        run: |
          MPIEXECJL_DIR="${GITHUB_WORKSPACE}/bin"
          julia --project --color=yes -e "using MPI; MPI.install_mpiexecjl(; destdir=\"${MPIEXECJL_DIR}\")"
          echo "${MPIEXECJL_DIR}" >> "${GITHUB_PATH}"
        working-directory: ${{ env.GB25_DIR }}
      - name: Compile GB-25 simulation
        timeout-minutes: 30
        run: |
          export XLA_FLAGS='--xla_disable_hlo_passes=multi_output_fusion --xla_dump_hlo_pass_re=.* --xla_dump_to=${{ env.GB25_DIR }}/xla_dump_compile'
          timeout --signal=TERM --verbose 29m mpiexecjl -np 1 julia --color=yes --project -O0 --startup-file=no --threads=16 --compiled-modules=strict sharding/sharded_baroclinic_instability_simulation_compile.jl ${{ matrix.grid }}
        working-directory: ${{ env.GB25_DIR }}
      - name: Show remaining collective operations
        timeout-minutes: 10
        shell: bash
        run: |
          OK="true"

          for OP in "stablehlo.gather" "stablehlo.scatter"; do
            NON_AFFINE=$(find . -name 'before_jit_sharded_baroclinic_instability_simulation_*.mlir' -exec grep --with-filename --line-number "${OP}" '{}' \; | sort)
            if [[ -n "${NON_AFFINE}" ]]
            then
              NUM_NON_AFFINE=$(echo "${NON_AFFINE}" | wc -l | xargs)
              MSG="There are ${NUM_NON_AFFINE} remaining ${OP} operations"
              echo "::error title=${{ inputs.os }} - Remaining ${OP} Operations:: ${MSG}"
              echo
              echo "----------"
              echo "${NON_AFFINE}"
              echo "----------"
              OK="false"
            fi
          done

          if [[ '${{ contains(inputs.os, 'a100') }}' == 'true' ]]; then
              ALL_TO_ALL_THRESHOLD=0
              ALL_GATHER_THRESHOLD=0
              ALL_REDUCE_THRESHOLD=0
              COLLECTIVE_PERMUTE_THRESHOLD=44
          elif [[ '${{ contains(inputs.os, 'tpu') }}' == 'true' ]]; then
              ALL_TO_ALL_THRESHOLD=0
              ALL_GATHER_THRESHOLD=0
              ALL_REDUCE_THRESHOLD=0
              COLLECTIVE_PERMUTE_THRESHOLD=1154
          fi

          for OP in "all-to-all" "all-gather" "all-reduce" "%collective-permute-start.* ="; do
              COLLECTIVES=$(find . -name 'optimised_sharded_baroclinic_instability*.xla' -exec grep --with-filename --line-number --extended-regexp "${OP}" '{}' \; | sort)
              NUM_COLLECTIVES=$(echo "${COLLECTIVES}" | wc -l | xargs)
              if [[ -n "${COLLECTIVES}" ]]; then
                  MSG="There are ${NUM_COLLECTIVES} remaining ${OP} operations"
                  echo "::error title=${{ inputs.os }} - Remaining ${OP} Operations:: ${MSG}"
                  echo
                  echo "----------"
                  echo "${COLLECTIVES}"
                  echo "----------"
                  if [[ "${OP}" == "all-to-all" && ${NUM_COLLECTIVES} -gt ${ALL_TO_ALL_THRESHOLD} ]] || [[ "${OP}" == "all-gather" && ${NUM_COLLECTIVES} -gt ${ALL_GATHER_THRESHOLD} ]] || [[ "${OP}" == "all-reduce" && ${NUM_COLLECTIVES} -gt ${ALL_REDUCE_THRESHOLD} ]] || [[ "${OP}" =~ "collective-permute" && ${NUM_COLLECTIVES} -gt ${COLLECTIVE_PERMUTE_THRESHOLD} ]]; then
                      OK="false"
                  fi
              fi
          done
          if [[ "${OK}" == "false" ]]; then
              exit 1
          fi
      - name: Run GB-25 simulation
        timeout-minutes: 60
        run: |
          export XLA_FLAGS='--xla_disable_hlo_passes=multi_output_fusion --xla_dump_hlo_pass_re=.* --xla_dump_to=${{ env.GB25_DIR }}/xla_dump_run'
          timeout --signal=TERM --verbose 59m mpiexecjl -np 1 julia --color=yes --project -O0 --startup-file=no --threads=16 --compiled-modules=strict sharding/sharded_baroclinic_instability_simulation_run.jl ${{ matrix.grid }}
        working-directory: ${{ env.GB25_DIR }}
      - name: Display profile results
        shell: julia --project --color=yes {0}
        run: |
          using Reactant

          prof_dir = joinpath(first(readdir(joinpath(pwd(), "sharding", "profiling"); join=true)), "loop2", "plugins", "profile")
          prof_dir = joinpath(first(readdir(prof_dir; join=true)))

          xplane_file = first(filter(endswith(".xplane.pb"), readdir(prof_dir; join=true)))

          display(Reactant.Profiler.load_xplane_file(xplane_file))
        working-directory: ${{ env.GB25_DIR }}
      - name: Test correctness in GB-25 code
        timeout-minutes: 20
        run: |
          timeout --signal=TERM --verbose 19m mpiexecjl -np 1 julia --color=yes --project -O0 --startup-file=no --threads=16 --compiled-modules=strict correctness/correctness_sharded_baroclinic_instability_simulation_run.jl ${{ matrix.grid }}
        working-directory: ${{ env.GB25_DIR }}
      - name: Upload MLIR and XLA modules
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          name: 'simulation-mlir-${{ env.ARTIFACT_INDEX }}'
          path: |
            ${{ env.GB25_DIR }}/**/*.mlir
            ${{ env.GB25_DIR }}/**/optimised_*.xla
          retention-days: 90
          overwrite: false
      - name: Upload XLA dump
        uses: actions/upload-artifact@v7
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        with:
          name: 'simulation-xla-dump-${{ env.ARTIFACT_INDEX }}'
          path: '${{ env.GB25_DIR }}/**/xla_dump*'
          retention-days: 90
          overwrite: false
      - name: Upload XLA profiler traces
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          name: 'simulation-xla-profile-${{ env.ARTIFACT_INDEX }}'
          path: '${{ env.GB25_DIR }}/**/plugins'
          retention-days: 90
          overwrite: false
