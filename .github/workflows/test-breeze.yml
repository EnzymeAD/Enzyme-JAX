name: Test Breeze

on:
  workflow_call:
    inputs:
      os:
        description: 'Runner label'
        required: true
        type: string
      device:
        description: 'Breeze device (GPU | TPU)'
        required: true
        type: string
      backend:
        description: 'Breeze backends to benchmark'
        required: true
        type: string
      libreactant_artifact:
        description: 'Prebuilt libReactant workflow artifact name'
        required: true
        type: string
      julia_version:
        description: 'Julia version'
        required: false
        default: '1.11'
        type: string
      xla_commit:
        description: 'XLA commit label for artifact naming'
        required: false
        default: ''
        type: string
      breeze_commit:
        description: 'Breeze.jl commit or branch'
        required: false
        default: 'main'
        type: string
      reactant_commit:
        description: 'Reactant.jl commit or branch'
        required: false
        default: 'main'
        type: string

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: 'eager'
  JULIA_MAX_NUM_PRECOMPILE_FILES: 3

jobs:
  test-breeze:
    name: 'Test Breeze - ${{ inputs.os }} - julia ${{ inputs.julia_version }} - XLA ${{ inputs.xla_commit }} - Breeze ${{ inputs.breeze_commit }} - Reactant ${{ inputs.reactant_commit }}'
    runs-on: ${{ inputs.os }}
    timeout-minutes: 150

    container:
      image: ${{ (contains(inputs.os, 'linux') && 'ghcr.io/enzymead/reactant-docker-images@sha256:cd45d851f5ea544f88d042eafefa53d948c229fffcab6189019324e3b02b505a' ) || '' }}

    steps:
      - name: Check GPUs
        if: ${{ contains(inputs.os, 'a100') }}
        run: |
          nvidia-smi
      - name: Set Artifacts index
        shell: bash
        run: |
          ARTIFACT_INDEX="${{ inputs.os }}-${{ inputs.julia_version }}-${{ inputs.xla_commit }}-${{ inputs.breeze_commit }}-${{ inputs.reactant_commit }}"
          ARTIFACT_INDEX=${ARTIFACT_INDEX//\//_}
          ARTIFACT_INDEX=${ARTIFACT_INDEX// /}
          echo "ARTIFACT_INDEX=${ARTIFACT_INDEX}" >> "${GITHUB_ENV}"
      - name: Checkout Enzyme-JAX helper scripts
        uses: actions/checkout@v7
        with:
          path: 'enzyme-jax-scripts'
          sparse-checkout: '.github/scripts'
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia_version }}
      - name: Load Julia packages from cache
        uses: julia-actions/cache@v3.5.0
        with:
          gcp-bucket: ${{ (contains(inputs.os, 'linux') && 'enzyme-ci-transient' ) || '' }}
          key-prefix: enzymejax-breeze/
      - name: Checkout Breeze
        uses: actions/checkout@v7
        with:
          repository: 'NumericalEarth/Breeze.jl'
          ref: ${{ inputs.breeze_commit }}
          path: 'Breeze.jl'
      - name: Set BREEZE_DIR
        # We have to use `${GITHUB_WORKSPACE}` instead of `github.workspace` because GitHub
        # is terrible and the two don't match inside containers:
        # https://github.com/actions/runner/issues/2058
        run: |
          BREEZE_DIR=${GITHUB_WORKSPACE}/Breeze.jl
          ls -lhrt "${BREEZE_DIR}"
          echo "BREEZE_DIR=${BREEZE_DIR}" >> ${GITHUB_ENV}
      - name: Download prebuilt libReactant
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.libreactant_artifact }}
          path: ${{ runner.temp }}/libreactant-artifact
      - name: Install prebuilt libReactant
        shell: bash
        run: |
          "${GITHUB_WORKSPACE}/enzyme-jax-scripts/.github/scripts/install_libreactant.sh" \
            "${RUNNER_TEMP}/libreactant-artifact/libreactant.tar.zst" \
            "${GITHUB_WORKSPACE}/libreactant" \
            "${BREEZE_DIR}/benchmarking/LocalPreferences.toml"
      - name: Remove Breeze Reactant compatibility pin
        shell: julia --color=yes {0}
        run: |
          using TOML
          for project_file in ("Project.toml", "benchmarking/Project.toml")
              project = TOML.parsefile(project_file)
              delete!(project["compat"], "Reactant")
              open(project_file, "w") do io
                  TOML.print(io, project)
              end
          end
        working-directory: ${{ env.BREEZE_DIR }}
      - name: Instantiate Breeze benchmarking environment
        timeout-minutes: 40
        shell: julia --color=yes --project {0}
        run: |
          using Pkg
          if !isempty("${{ inputs.reactant_commit }}")
              Pkg.add([
                  PackageSpec(; name="ReactantCore", rev="${{ inputs.reactant_commit }}"),
                  PackageSpec(; name="Reactant", rev="${{ inputs.reactant_commit }}"),
              ])
          end

          Pkg.add("Reactant_jll")

          Pkg.instantiate()
          Pkg.gc()
        working-directory: ${{ env.BREEZE_DIR }}/benchmarking
      - name: Upload Julia project environment
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        if: ${{ always() }}
        with:
          name: 'julia-environment-${{ env.ARTIFACT_INDEX }}'
          path: |
            ${{ env.BREEZE_DIR }}/benchmarking/Manifest.toml
            ${{ env.BREEZE_DIR }}/benchmarking/Project.toml
          retention-days: 90
          overwrite: false
      - name: Run single (scalar) tendency benchmark
        timeout-minutes: 60
        run: |
          export XLA_FLAGS='--xla_disable_hlo_passes=multi_output_fusion --xla_dump_hlo_pass_re=.* --xla_dump_to=${{ env.BREEZE_DIR }}/benchmarking/xla_dump'
          timeout --signal=TERM --verbose 59m julia --color=yes --project -O0 --startup-file=no run_benchmarks.jl \
              --device ${{ inputs.device }} --mode scalar_tendency \
              --dynamics none --microphysics none --topology PPB \
              --advection "WENO5, WENO7, WENO9" --size 256x256x128 \
              --backend "${{ inputs.backend }}" --float_type Float32,BFloat16 --time_steps 320
        working-directory: ${{ env.BREEZE_DIR }}/benchmarking
      - name: Run full model tendency benchmark
        timeout-minutes: 60
        run: |
          export XLA_FLAGS='--xla_disable_hlo_passes=multi_output_fusion --xla_dump_hlo_pass_re=.* --xla_dump_to=${{ env.BREEZE_DIR }}/benchmarking/xla_dump'
          timeout --signal=TERM --verbose 59m julia --color=yes --project -O0 --startup-file=no run_benchmarks.jl \
              --device ${{ inputs.device }} --mode model_tendency \
              --dynamics none --microphysics none --topology PPB \
              --advection "WENO5, WENO7, WENO9" --size 256x256x128 \
              --backend "${{ inputs.backend }}" --float_type Float32 --time_steps 320
        working-directory: ${{ env.BREEZE_DIR }}/benchmarking
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          name: 'benchmark-results-${{ env.ARTIFACT_INDEX }}'
          path: '${{ env.BREEZE_DIR }}/benchmarking/benchmark_results.*'
          retention-days: 90
          overwrite: false
      - name: Upload MLIR dumps
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          name: 'mlir-dumps-${{ env.ARTIFACT_INDEX }}'
          path: '${{ env.BREEZE_DIR }}/benchmarking/mlir_dumps'
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
      - name: Upload XLA dump
        uses: actions/upload-artifact@v7
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        with:
          name: 'xla-dump-${{ env.ARTIFACT_INDEX }}'
          path: '${{ env.BREEZE_DIR }}/benchmarking/xla_dump'
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
      - name: Upload XLA profiler traces
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          name: 'xla-profile-${{ env.ARTIFACT_INDEX }}'
          path: '${{ env.BREEZE_DIR }}/benchmarking/profiles'
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
